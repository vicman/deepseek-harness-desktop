<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness — diagnóstico</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: #0d0f12; color: #e6e8eb;
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .caja { max-width: 520px; padding: 32px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: #9aa3ad; margin: 0 0 10px; }
  code {
    display: block; margin-top: 16px; padding: 12px;
    background: #16191d; border: 1px solid #262b31; border-radius: 8px;
    color: #7dd3a0; font-family: ui-monospace, monospace; font-size: 13px;
    text-align: left; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>No se pudo iniciar el servidor de DeepSeek Harness</h1>
    <p>La ventana se abrió, pero el backend <code>dsh web</code> no respondió en 60 segundos.</p>
    <p>Comprueba que el comando funciona en tu terminal:</p>
    <code>dsh web --no-open --port 3080</code>
    <p style="margin-top:18px">Si ahí funciona, cierra esta app y vuelve a abrirla.</p>
  </div>
</body>
</html>
