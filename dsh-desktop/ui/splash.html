<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>DeepSeek Harness</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;display:grid;place-items:center;
background:radial-gradient(120% 120% at 50% 0%,#1a1d23 0%,#0d0f12 55%);
color:#e6e8eb;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
user-select:none;-webkit-user-select:none}
.caja{display:grid;justify-items:center;gap:22px}
.logo{position:relative;width:210px;height:158px;display:grid;place-items:center}
.logo::before{content:"";position:absolute;inset:-8px;border-radius:50%;
background:radial-gradient(circle,rgba(96,109,134,.35) 0%,transparent 70%);
animation:halo 2.4s ease-in-out infinite}
.logo img{width:190px;height:auto;position:relative;opacity:0;transition:opacity .25s ease;animation:flotar 2.8s ease-in-out infinite}
.logo img.lista{opacity:1}
@keyframes halo{0%,100%{transform:scale(.88);opacity:.45}50%{transform:scale(1.12);opacity:.9}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
h1{margin:0;font-size:17px;font-weight:550;letter-spacing:-.01em;color:#f0f2f4}
.barra{width:190px;height:3px;border-radius:99px;background:#23272e;overflow:hidden;position:relative}
.barra::after{content:"";position:absolute;inset:0;width:42%;border-radius:99px;
background:linear-gradient(90deg,#3b4250,#6b7a94,#3b4250);
animation:correr 1.35s cubic-bezier(.65,.05,.36,1) infinite}
@keyframes correr{0%{transform:translateX(-105%)}100%{transform:translateX(340%)}}
.estado{margin:0;font-size:13px;color:#7f8791;transition:opacity .3s ease}
</style></head><body>
<div class="caja">
<div class="logo">
<img src="logo-splash.png" alt=""></div>
<h1>DeepSeek Harness</h1>
<div class="barra"></div>
<p class="estado" id="estado"></p>
</div>
<script>
// ---------------------------------------------------------------------------
// Idiomas
// ---------------------------------------------------------------------------
// El idioma se elige asi:
//   1. El que pase la aplicacion desde Rust (?lang=xx o window.dshIdioma).
//   2. El del equipo (navigator.language).
//   3. Espanol por defecto.
// Espanol, ingles y portugues; cualquier otro idioma cae al espanol.
var TEXTOS = {
  es: {
    pasos: ["Iniciando\u2026","Cargando complementos\u2026",
            "Preparando el espacio de trabajo\u2026","Casi listo\u2026"],
    instalando: "Instalando DeepSeek Harness\u2026",
    errorInstalar: "No se pudo instalar DeepSeek Harness.\n" +
                   "Instalalo a mano con: pnpm add -g @deepseek-ai/dsh",
    errorServidor: "DeepSeek Harness no respondio a tiempo.",
    avisoVersion: function (v) {
      return "Hay una version nueva de DeepSeek Harness (" + v + "). " +
             "Actualiza con: pnpm add -g @deepseek-ai/dsh";
    }
  },
  en: {
    pasos: ["Starting\u2026","Loading components\u2026",
            "Preparing your workspace\u2026","Almost ready\u2026"],
    instalando: "Installing DeepSeek Harness\u2026",
    errorInstalar: "Could not install DeepSeek Harness.\n" +
                   "Install it manually with: pnpm add -g @deepseek-ai/dsh",
    errorServidor: "DeepSeek Harness did not respond in time.",
    avisoVersion: function (v) {
      return "A new version of DeepSeek Harness is available (" + v + "). " +
             "Update with: pnpm add -g @deepseek-ai/dsh";
    }
  },
  pt: {
    pasos: ["Iniciando\u2026","Carregando componentes\u2026",
            "Preparando seu espaco de trabalho\u2026","Quase pronto\u2026"],
    instalando: "Instalando o DeepSeek Harness\u2026",
    errorInstalar: "Nao foi possivel instalar o DeepSeek Harness.\n" +
                   "Instale manualmente com: pnpm add -g @deepseek-ai/dsh",
    errorServidor: "O DeepSeek Harness nao respondeu a tempo.",
    avisoVersion: function (v) {
      return "Ha uma nova versao do DeepSeek Harness (" + v + "). " +
             "Atualize com: pnpm add -g @deepseek-ai/dsh";
    }
  }
};

// Normaliza "es-CO", "en_US", "pt-BR" -> "es" | "en" | "pt".
function normalizar(codigo) {
  var base = String(codigo || "").toLowerCase().split(/[-_]/)[0];
  return TEXTOS[base] ? base : null;
}

function elegirIdioma() {
  // 1) Lo que indique la aplicacion.
  var deUrl = new URLSearchParams(location.search).get("lang");
  var elegido = normalizar(deUrl) || normalizar(window.dshIdioma);
  if (elegido) return elegido;

  // 2) El idioma del equipo, incluidos los preferidos del navegador.
  var lista = navigator.languages && navigator.languages.length
    ? navigator.languages
    : [navigator.language];
  for (var i = 0; i < lista.length; i++) {
    var c = normalizar(lista[i]);
    if (c) return c;
  }

  // 3) Espanol por defecto.
  return "es";
}

var IDIOMA = elegirIdioma();
var T = TEXTOS[IDIOMA];

// La aplicacion tambien puede cambiar el idioma en caliente.
window.dshIdioma = IDIOMA;

// ---------------------------------------------------------------------------
// Rotacion de mensajes
// ---------------------------------------------------------------------------
var pasos = T.pasos;
var i = 0, e = document.getElementById("estado"), temporizador = null;
e.textContent = pasos[0]; // primer mensaje, ya en el idioma elegido

function rotar() {
  temporizador = setInterval(function () {
    i++;
    if (i < pasos.length) {
      e.style.opacity = "0";
      setTimeout(function () { e.textContent = pasos[i]; e.style.opacity = "1"; }, 150);
    }
  }, 1200);
}
rotar();

// ---------------------------------------------------------------------------
// Funciones que llama la aplicacion desde Rust
// ---------------------------------------------------------------------------
// Los mensajes llegan como CLAVES ("instalando", "errorServidor"...) para que
// el texto salga en el idioma elegido y no incrustado desde Rust.
function traducir(clave, dato) {
  var v = T[clave];
  if (typeof v === "function") return v(dato);
  return v || clave;
}

// dshEstado: fija un mensaje concreto (p. ej. mientras instala DSH).
window.dshEstado = function (clave) {
  if (temporizador) { clearInterval(temporizador); temporizador = null; }
  e.style.opacity = "1";
  e.textContent = traducir(clave);
};

// dshAviso: aviso discreto que no bloquea el arranque.
window.dshAviso = function (clave, dato) {
  var a = document.getElementById("aviso");
  if (!a) {
    a = document.createElement("p");
    a.id = "aviso";
    a.style.cssText = "margin:14px 0 0;font-size:12px;line-height:1.5;" +
      "color:#8b93a0;max-width:420px;text-align:center";
    document.querySelector(".caja").appendChild(a);
  }
  a.textContent = traducir(clave, dato);
};

// dshError: fallo irrecuperable; se detiene la animacion y se resalta.
window.dshError = function (clave) {
  if (temporizador) { clearInterval(temporizador); temporizador = null; }
  e.style.color = "#e5726b";
  e.style.opacity = "1";
  e.textContent = traducir(clave);
  var b = document.querySelector(".barra");
  if (b) { b.style.background = "#3a2224"; }
};
</script><script>(function(){var i=document.querySelector(".logo img");if(!i)return;function m(){i.classList.add("lista")}if(i.complete&&i.naturalWidth>0){m()}else{i.addEventListener("load",m);i.addEventListener("error",m);}})();</script>
</body></html>
